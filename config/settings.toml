# Committed, non-secret application configuration.
# Credentials belong only in the ignored repository-root .secrets.env file.

[application]
app_name = "wealth-decoded-ai"
environment = "local"
host = "0.0.0.0"
port = 8000
log_level = "INFO"
database_pool_size = 5
database_max_overflow = 10
request_id_header = "X-Request-ID"

[openai]
model = "gpt-5.6-luna"
temperature = 0.4
max_tokens = 4000

[storyboard]
max_output_tokens = 8000

[visual_assets]
live_generation = true
max_live_images = 4
fail_fast = false
image_model = "gpt-image-2"
image_quality = "low"

[voiceover]
voice_id = "onwK4e9ZLuTAKqWW03F9"
model_id = "eleven_multilingual_v2"
output_format = "mp3_44100_128"
stability = 0.5
similarity_boost = 0.75
style = 0.0
use_speaker_boost = true

[render]
ffmpeg_executable = "ffmpeg"
ffprobe_executable = "ffprobe"
render_timeout_seconds = 900
render_graceful_termination_seconds = 5
ffprobe_timeout_seconds = 30

[development]
save_raw_llm = false
